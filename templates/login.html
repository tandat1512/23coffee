<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Đăng Nhập — 23 COFFEE</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: {
              600: '#1B365D',
              700: '#142846',
              800: '#0E1C31',
              accent: '#C59B27'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bg-gradient-coffee {
      background: radial-gradient(circle at top right, #243B55 0%, #141E30 100%);
    }
    input, select, textarea {
      font-size: 16px !important;
    }
  </style>
</head>
<body class="bg-gradient-coffee min-h-screen flex items-center justify-center p-3 sm:p-6">

  <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl overflow-hidden border border-white/20 my-auto">
    
    <!-- Header Banner -->
    <div class="bg-brand-600 text-white p-5 sm:p-6 text-center relative">
      <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-amber-300 text-2xl sm:text-3xl font-black mx-auto mb-2.5 shadow-inner">
        <i class="fa-solid fa-mug-hot"></i>
      </div>
      <h1 class="text-xl sm:text-2xl font-black tracking-tight">23 COFFEE</h1>
      <p class="text-xs text-slate-300 mt-0.5">Hệ Thống Quản Trị Cost & Menu Nội Bộ</p>
      
      <div class="mt-2.5 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/20 text-amber-200 border border-amber-400/30 text-[11px] font-semibold">
        <i class="fa-solid fa-shield-halved text-[10px]"></i>
        <span>Xác Thực Bảo Mật Nội Bộ</span>
      </div>
    </div>

    <!-- Login Form -->
    <div class="p-5 sm:p-7 space-y-4 sm:space-y-5">

      {% if error %}
      <div class="p-3 bg-red-50 border border-red-200 text-red-700 text-xs sm:text-sm rounded-xl flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation text-base flex-shrink-0"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tài Khoản</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
            <input type="text" name="username" required autofocus placeholder="Nhập tài khoản" class="w-full pl-10 pr-3 py-2.5 sm:py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-transparent">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mật Khẩu</label>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
            <input type="password" name="password" required placeholder="Nhập mật khẩu" class="w-full pl-10 pr-3 py-2.5 sm:py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-600 focus:border-transparent">
          </div>
        </div>

        <button type="submit" class="w-full py-3 sm:py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-sm sm:text-base shadow-lg shadow-brand-600/30 transition transform active:scale-98 flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span>Đăng Nhập Vào Hệ Thống</span>
        </button>
      </form>

    </div>

    <!-- Footer -->
    <div class="bg-slate-100 p-3 text-center text-[11px] text-slate-500 border-t border-slate-200">
      23 COFFEE © 2026 — Bảo mật nội bộ
    </div>

  </div>

</body>
</html>
