services:
  - type: web
    name: 23coffee-cost-engine
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: USER1_USER
        value: admin
      - key: USER1_PASS
        value: admin
      - key: USER2_USER
        value: tandat
      - key: USER2_PASS
        value: admin
      - key: GOOGLE_SHEET_WEBHOOK
        value: https://script.google.com/macros/s/AKfycbz3XF_9TVUAA5XPXnFq9nYakh0qm3Kuc78vl50nIYxodfQI0iMDhSJC78hdy4aU8yAFJg/exec
